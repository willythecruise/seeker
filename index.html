      (q.type === 'mcq' || q.type === 'multi' ? runnerOptsHTML(q, l.answers[q.id]) : q.type === 'matching' ? runnerMatchingHTML(q, l.answers[q.id]) : q.type === 'ordering' ? runnerOrderingHTML(q, l.answers[q.id]) : q.type === 'code' ? runnerCodeHTML(q, l.answers[q.id]) : runnerFillHTML(l.answers[q.id])) +
      '<div class="q-nav">' +
        '<button class="btn btn-secondary" data-action="prev-q" ' + (idx === 0 ? 'disabled' : '') + '>' + ic('arrowL', 15) + ' Previous</button>' +
        '<span class="hint-keys">1\u20134 answer · F flag</span>' +
        (idx < total - 1
          ? '<button class="btn btn-primary" data-action="next-q">Next ' + ic('chevronR', 15) + '</button>'
          : '<button class="btn btn-primary" data-action="ask-submit">' + ic('check', 14) + ' Submit test</button>') +
      '</div>' +
    '</div>' +

    '<aside class="card side-card">' +
      '<div class="side-title">Question navigator</div>' +
      '<div class="palette" id="palette">' +
        l.order.map((qid, i) => {
          const v = l.answers[qid];
          const has = v !== undefined && v !== null && v !== '';
          return '<button class="palette-item ' + (has ? 'answered' : '') + ' ' + (i === idx ? 'current' : '') + ' ' + (l.flagged[i] ? 'flagged' : '') + '" data-action="jump" data-idx="' + i + '" aria-label="Question ' + (i + 1) + '">' + (i + 1) + '</button>';
        }).join('') +
      '</div>' +
      '<div class="legend">' +
        '<div class="legend-item"><span class="legend-swatch ls-answered"></span> Answered</div>' +
        '<div class="legend-item"><span class="legend-swatch ls-current"></span> Current</div>' +
        '<div class="legend-item"><span class="legend-swatch ls-flagged"></span> Flagged</div>' +
        '<div class="legend-item"><span class="legend-swatch ls-unanswered"></span> Unanswered</div>' +
      '</div>' +
      '<div style="margin-top:16px;display:flex;flex-direction:column;gap:8px">' +
        '<button class="btn btn-primary" style="width:100%" data-action="ask-submit">' + ic('check', 14) + ' Submit test</button>' +
        '<button class="btn btn-secondary" style="width:100%" data-action="leave-test">' + ic('logout', 14) + ' Leave &amp; save</button>' +
      '</div>' +
    '</aside>' +
  '</div>';
}

function runnerOptsHTML(q, val) {
  if (q.type === 'multi') {
    const sel = Array.isArray(val) ? val : [];
    return '<div class="opts" aria-label="Answer options (choose all that apply)">' +
      q.options.map((o, i) =>
        '<button class="opt ' + (sel.includes(i) ? 'selected' : '') + '" data-action="opt" data-opt="' + i + '" role="checkbox" aria-checked="' + sel.includes(i) + '">' +
          '<span class="opt-key">' + LETTERS[i] + '</span><span>' + esc(o) + '</span>' +
          '<span class="opt-multi-mark" style="margin-left:auto;display:grid;place-items:center;color:' + (sel.includes(i) ? 'var(--accent)' : 'var(--text-3)') + '">' + ic('check', 14) + '</span>' +
        '</button>').join('') +
    '</div>';
  }
  return '<div class="opts" role="radiogroup" aria-label="Answer options">' +
    q.options.map((o, i) =>
      '<button class="opt ' + (val === i ? 'selected' : '') + '" data-action="opt" data-opt="' + i + '" role="radio" aria-checked="' + (val === i) + '">' +
        '<span class="opt-key">' + LETTERS[i] + '</span><span>' + esc(o) + '</span>' +
      '</button>').join('') +
  '</div>';
}

function runnerMatchingHTML(q, val) {
  const sel = Array.isArray(val) ? val : [];
  return '<div class="match-grid">' +
    (q.pairsLeft || []).map((left, i) =>
      '<div class="match-row">' +
        '<span class="match-left">' + esc(left) + '</span>' +
        '<select class="input match-select" data-action="match" data-i="' + i + '" aria-label="Match for: ' + esc(left) + '">' +
          '<option value="">— choose —</option>' +
          q.options.map((o, oi) => '<option value="' + oi + '" ' + (sel[i] === oi ? 'selected' : '') + '>' + esc(o) + '</option>').join('') +
        '</select>' +
      '</div>').join('') +
  '</div>';
}

function runnerOrderingHTML(q, val) {
  const items = q.items || [];
  const order = Array.isArray(val) && val.length === items.length ? val.slice() : items.map((_, i) => i);
  return '<div class="order-list" id="orderList">' +
    order.map((itemIdx, pos) =>
      '<div class="order-row" data-pos="' + pos + '">' +
        '<span class="order-num">' + (pos + 1) + '</span>' +
        '<span class="order-item">' + esc(items[itemIdx]) + '</span>' +
        '<button class="btn-icon order-btn" data-action="order-move" data-dir="-1" data-pos="' + pos + '" ' + (pos === 0 ? 'disabled' : '') + ' title="Move up">' + ic('chevronD', 15) + '</button>' +
        '<button class="btn-icon order-btn" data-action="order-move" data-dir="1" data-pos="' + pos + '" ' + (pos === order.length - 1 ? 'disabled' : '') + ' title="Move down">' + ic('chevronR', 15) + '</button>' +
      '</div>').join('') +
  '</div>';
}

function runnerCodeHTML(q, val) {
  const code = val || q.codeStub || '';
  return '<div class="code-box">' +
    '<div class="code-box-head">' +
      '<span class="badge b-mcq">' + ic('terminal2', 11) + ' ' + esc(q.codeLang === 'python' ? 'Python' : 'JavaScript') + '</span>' +
      '<span style="font-size:12px;color:var(--text-3)">Define <b>solution</b>. Press Run to test against the sample</span>' +
    '</div>' +
    '<textarea class="code-editor" id="codeEditor" data-action="code" spellcheck="false" autocapitalize="off" autocomplete="off">' + esc(code) + '</textarea>' +
    '<div class="code-box-foot">' +
      '<button class="btn btn-secondary btn-sm" data-action="run-code">' + ic('play', 13) + ' Run sample</button>' +
      '<span id="codeOut" class="code-out"></span>' +
    '</div>' +
  '</div>';
}

function runnerFillHTML(val) {
  return '<input class="fill-input" id="fillInput" data-action="fill" placeholder="Type your answer\u2026" value="' + esc(val || '') + '" autocomplete="off" autocapitalize="off" spellcheck="false">';
}

/* ── Runner interactions ───────────────────────────────────── */

function selectOpt(i) {
  if (!S.live) return;
  const q = qOf(S.live.order[S.qIdx]);
  if (!q || (q.type !== 'mcq' && q.type !== 'multi')) return;
  if (q.type === 'multi') {
    const sel = Array.isArray(S.live.answers[q.id]) ? S.live.answers[q.id].slice() : [];
    const at = sel.indexOf(i);
    if (at >= 0) sel.splice(at, 1); else sel.push(i);
    sel.sort((a, b) => a - b);
    S.live.answers[q.id] = sel;
    $$('.opts .opt').forEach(o => {
      const on = sel.includes(+o.dataset.opt);
      o.classList.toggle('selected', on);
      o.setAttribute('aria-checked', on);
      const mark = o.querySelector('.opt-multi-mark');
      if (mark) mark.style.color = on ? 'var(--accent)' : 'var(--text-3)';
    });
    $$('#palette .palette-item').forEach(b => { if (+b.dataset.idx === S.qIdx) b.classList.toggle('answered', sel.length > 0); });
  } else {
    S.live.answers[q.id] = i;
    $$('#palette .palette-item').forEach(b => { if (+b.dataset.idx === S.qIdx) b.classList.add('answered'); });
    $$('.opts .opt').forEach(o => {
      o.classList.toggle('selected', +o.dataset.opt === i);
      o.setAttribute('aria-checked', +o.dataset.opt === i);
    });
  }
  updateRunnerCounters();
  saveAnswerToServer(q.id, S.live.answers[q.id]);
}

let _fillTimer = null;
function handleFillInput(el) {
  if (!S.live) return;
  const q = qOf(S.live.order[S.qIdx]);
  if (!q || q.type !== 'fill') return;
  S.live.answers[q.id] = el.value;
  $$('#palette .palette-item').forEach(b => {
    if (+b.dataset.idx === S.qIdx) b.classList.toggle('answered', el.value.trim() !== '');
  });
  updateRunnerCounters();
  clearTimeout(_fillTimer);
  _fillTimer = setTimeout(() => saveAnswerToServer(q.id, el.value), 400);
}

async function saveAnswerToServer(qid, value) {
  if (!S.live) return;
  try {
    await API.post('/api/candidate/attempts/' + S.live.id + '/answer', { qid, value });
  } catch (e) {
    if (e.status === 409) { toast('This attempt was already submitted', 'error'); }
    else if (e.status === 400) { toast(e.message, 'error'); }
    else { toast('Answer not saved: ' + e.message, 'error'); }
  }
}

function handleMatchSelect(i, optIdx) {
  if (!S.live) return;
  const q = qOf(S.live.order[S.qIdx]);
  if (!q || q.type !== 'matching') return;
  const arr = Array.isArray(S.live.answers[q.id]) ? S.live.answers[q.id].slice() : (q.pairsLeft || []).map(() => -1);
  arr[i] = optIdx === '' ? -1 : +optIdx;
  S.live.answers[q.id] = arr;
  $$('#palette .palette-item').forEach(b => { if (+b.dataset.idx === S.qIdx) b.classList.toggle('answered', arr.some(v => v !== -1 && v !== '')); });
  updateRunnerCounters();
  saveAnswerToServer(q.id, arr);
}

function moveOrderItem(pos, dir) {
  if (!S.live) return;
  const q = qOf(S.live.order[S.qIdx]);
  if (!q || q.type !== 'ordering') return;
  const items = q.items || [];
  const cur = Array.isArray(S.live.answers[q.id]) && S.live.answers[q.id].length === items.length ? S.live.answers[q.id].slice() : items.map((_, i) => i);
  const np = pos + dir;
  if (np < 0 || np >= cur.length) return;
  [cur[pos], cur[np]] = [cur[np], cur[pos]];
  S.live.answers[q.id] = cur;
  updateRunnerCounters();
  saveAnswerToServer(q.id, cur);
  // re-render the list in place
  const wrap = $('#orderList');
  if (wrap) wrap.outerHTML = runnerOrderingHTML(q, cur);
}

function handleCodeInput(el) {
  if (!S.live) return;
  const q = qOf(S.live.order[S.qIdx]);
  if (!q || q.type !== 'code') return;
  S.live.answers[q.id] = el.value;
  $$('#palette .palette-item').forEach(b => { if (+b.dataset.idx === S.qIdx) b.classList.toggle('answered', el.value.trim() !== ''); });
  updateRunnerCounters();
  clearTimeout(_fillTimer);
  _fillTimer = setTimeout(() => saveAnswerToServer(q.id, el.value), 400);
}

async function runCode() {
  if (!S.live) return;
  const q = qOf(S.live.order[S.qIdx]);
  if (!q || q.type !== 'code') return;
  const code = ($('#codeEditor') || {}).value || '';
  if (!code.trim()) { toast('Write code first', 'error'); return; }
  const out = $('#codeOut');
  if (out) out.textContent = 'Running…';
  try {
    const r = await API.post('/api/candidate/attempts/' + S.live.id + '/run-code', {
      qid: q.id, code: code, args: q.sample ? q.sample.args : [], expected: q.sample ? q.sample.expected : null
    });
    if (out) {
      if (r.pass) out.textContent = '✓ Passed — got ' + (r.got !== undefined ? r.got : 'expected');
      else if (r.error) out.textContent = '✗ ' + r.error;
      else out.textContent = '✗ Expected ' + r.want + ', got ' + r.got;
    }
  } catch (e) {
    if (out) out.textContent = '✗ ' + e.message;
  }
}

function toggleFlag() {
  if (!S.live) return;
  S.live.flagged[S.qIdx] = !S.live.flagged[S.qIdx];
  const btn = $('#flagBtn'), label = $('#flagLabel');
  if (btn) { btn.classList.toggle('flagged', S.live.flagged[S.qIdx]); if (label) label.textContent = S.live.flagged[S.qIdx] ? 'Flagged' : 'Flag for review'; }
  $$('#palette .palette-item').forEach(b => { if (+b.dataset.idx === S.qIdx) b.classList.toggle('flagged', S.live.flagged[S.qIdx]); });
  API.post('/api/candidate/attempts/' + S.live.id + '/flag', { idx: S.qIdx, flagged: S.live.flagged[S.qIdx] }).catch(() => {});
}

function updateRunnerCounters() {
  if (!S.live) return;
  const total = S.live.order.length;
  const answered = countAnsweredIn(S.live);
  const c = $('#answeredCount');
  if (c) c.textContent = answered + '/' + total + ' answered';
  const pf = $('#progFill');
  if (pf) pf.style.width = (total ? Math.round(answered / total * 100) : 0) + '%';
}

function navQ(dir) {
  if (!S.live) return;
  const next = S.qIdx + dir;
  if (next < 0 || next >= S.live.order.length) return;
  S.qIdx = next;
  render();
}

function jumpTo(i) {
  if (!S.live || i < 0 || i >= S.live.order.length) return;
  S.qIdx = i;
  render();
}

function leaveTest() {
  stopTimer();
  S.candView = 'home';
  render();
  toast('Progress saved. You can resume the test later');
}

function askSubmit() {
  if (!S.live) return;
  const total = S.live.order.length;
  const answered = countAnsweredIn(S.live);
  const unanswered = total - answered;
  confirmModal({
    title: 'Submit this test?',
    body: 'You have answered <b>' + answered + '</b> of <b>' + total + '</b> questions' +
      (unanswered ? ' — <b>' + unanswered + '</b> unanswered question' + (unanswered > 1 ? 's' : '') + ' count as incorrect.' : '.') +
      ' You have <b>' + fmtClock(S.live.remaining) + '</b> left.',
    confirmLabel: 'Submit test',
    onConfirm: () => { closeModal(); submitAttempt(false); }
  });
}

async function submitAttempt(auto) {
  stopTimer();
  const att = S.live;
  if (!att) return;
  try {
    const r = await API.post('/api/candidate/attempts/' + att.id + '/submit', { leaves: att.leaves || 0 });
    S.live = null;
    S.liveQuestions = {};
    if (r.attempt) {
      S.candResult = normalizeAttempt(r.attempt);
      buildQPool(Object.values(r.questions || {}));
      S.candView = 'result';
    } else {
      S.candView = 'home';
    }
    render();
    toast(auto ? 'Time is up. Test submitted' : 'Test submitted', 'success');
    if (S.candAuth && S.candAuth.viewResults) loadCandStats();
  } catch (e) {
    toast(e.message, 'error');
    if (e.status === 409) { S.live = null; S.candView = 'home'; render(); }
    else { startTimer(); }
  }
}

/* ── Candidate results ─────────────────────────────────────── */

        '<button class="g-share" data-action="share-result" title="Copy your result summary">' + ic('link', 14) + ' Share result</button>' +
      '</div>' +

    '<div class="g-body">' +
      '<div class="g-cards">' +
        '<div class="g-card g-score" style="grid-column:1/-1">' +
          '<div class="g-big"><b id="resultBig">' + rec.pct + '</b><small>/ 100</small></div>' +
          '<div>' +
            '<span class="g-signal ' + signalCls + '">' + signalTxt + '</span>' +

          '</div>' +
        '</div>' +
        '<div class="g-card g-stat">' +
          '<span class="g-kicker">Correct</span>' +

          '<p>questions answered correctly</p>' +

  (rec.showAnswers !== false ? '<div class="card" style="margin-top:16px">' +

  '</div>' : '');
}

async function backToHome() {
  S.candView = 'home';
  S.candResult = null;
  render();
  await refreshCandidate();
}

function animateScore() {
  const el = $('#resultBig');
  if (!el || !S.candResult) return;
  const target = S.candResult.pct || 0;
  const start = performance.now();
  const dur = 900;
  function step(now) {
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = String(Math.round(target * eased));
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
/* ============================================================
   Orion — init: boot, data loading, event delegation
   ============================================================ */

async function refreshAuth() {
  try {
    const r = await API.get('/api/auth/me');
    S.auth = r.admin;
    return true;
  } catch (e) {
    S.auth = null;
    return false;
  }
}

async function loadAdminData() {
  try {
    const [stats, questions, tests, attempts] = await Promise.all([
      API.get('/api/admin/stats'),
      API.get('/api/admin/questions'),
      API.get('/api/admin/tests'),
      API.get('/api/admin/attempts')
    ]);
    S.stats = stats;
    S.questions = questions;
    S.tests = tests;
    S.attempts = attempts;
    buildQPool(questions);
    if (S.auth && S.auth.role === 'superadmin') {
      try { S.admins = await API.get('/api/admin/admins'); } catch (e) { S.admins = []; }
    }
    try { S.candidates = await API.get('/api/admin/candidates'); } catch (e) { S.candidates = []; }
  } catch (e) {
    if (e.status === 401) {
      S.auth = null;
      S.view = 'login';
    } else {
      toast(e.message, 'error');
    }
  }
  render();
}

/* ── Render dispatcher ─────────────────────────────────────── */

function render() {
  const app = $('#app');
  if (!app) return;
  app.innerHTML = S.mode === 'candidate' ? candidateShell() : consoleShell();
  postRender();
}

function postRender() {
  positionSeg('#modeSeg', '#modeThumb', S.mode === 'candidate' ? 1 : 0);

  if (S.mode === 'console' && !S.auth) {
    checkBootstrap();
    return;
  }
  if (S.mode === 'console' && S.tab === 'editor' && tDraft) {
    positionSeg('#diffSeg', '#diffThumb', ['beginner', 'balanced', 'advanced'].indexOf(tDraft.diffFocus));
  }
  if (S.mode === 'console' && S.tab === 'questions') {
    const ci = ['all'].concat(CATS.map(c => c.id)).indexOf(S.qFilters.cat);
    const di = ['all', 'beginner', 'intermediate', 'advanced'].indexOf(S.qFilters.diff);
    const ti = ['all', 'mcq', 'multi', 'fill'].indexOf(S.qFilters.type);
    positionSeg('#catSeg', '#catThumb', ci);
    positionSeg('#diffSeg2', '#diffThumb2', di);
    positionSeg('#typeSeg', '#typeThumb', ti);
    if (S._focusSearch === 'local') {
      const inp = $('#qSearch');
      if (inp) { inp.focus(); const l = inp.value.length; inp.setSelectionRange(l, l); }
    }
  }
  if (S._focusSearch === 'global') {
    const inp = $('#globalSearch');
    if (inp) { inp.focus(); const l = inp.value.length; inp.setSelectionRange(l, l); }
    S._focusSearch = null;
  }
  if (S.modal && qDraft) {
    positionSeg('#qDiffSeg', '#qDiffThumb', Math.max(0, ['beginner', 'intermediate', 'advanced'].indexOf(qDraft.diff)));
    positionSeg('#qTypeSeg', '#qTypeThumb', { fill: 5, multi: 1, matching: 2, ordering: 3, mcq: 0, code: 4 }[qDraft.type] || 0);
  }
  if (S.mode === 'candidate' && S.candView === 'result') animateScore();
  if (S.mode === 'candidate' && S.candView === 'runner' && S.live) updateTimerUI();
}

/* ── Navigation ────────────────────────────────────────────── */

async function setMode(m) {
  if (S.mode === m) return;
  if (m === 'candidate') {
    if (S.live && S.candView === 'runner') stopTimer();
    S.mode = m;
    S.candView = 'home';
    render();
    await refreshCandidate();
  } else {
    S.mode = m;
    S.candView = 'home';
    if (!S.auth) {
      S.view = 'login';
      render();
    } else {
      await loadAdminData();   // refresh stats/attempts when returning to console
    }
  }
}

function setTab(t) {
  if (S.tab === 'editor' && t !== 'editor' && tDraft && (tDraft.name.trim() || tDraft.cats.size !== CATS.length)) {
    confirmModal({
      title: 'Discard draft?',
      body: 'Your unsaved test configuration will be lost.',
      confirmLabel: 'Discard',
      danger: true,
      onConfirm: () => { tDraft = null; closeModal(); setTab(t); }
    });
    return;
  }
  S.tab = t;
  if (t === 'activity') loadEvents();
  if (t === 'candidates') loadCandidates();
  render();
}

/* ── Test editor helpers ───────────────────────────────────── */

function toggleCat(cid) {
  if (!tDraft) return;
  if (tDraft.cats.has(cid)) tDraft.cats.delete(cid); else tDraft.cats.add(cid);
  clampCount();
  render();
}

function setDiffFocus(v) { if (tDraft) { tDraft.diffFocus = v; clampCount(); render(); } }

function stepField(field, dir) {
  if (!tDraft) return;
  if (field === 'duration') tDraft.duration = Math.min(240, Math.max(1, tDraft.duration + dir * 5));
  if (field === 'pass') tDraft.pass = Math.min(100, Math.max(0, tDraft.pass + dir * 5));
  if (field === 'count') { tDraft.count = Math.min(eligibleQuestions().length, Math.max(1, tDraft.count + dir)); }
  render();
}

function setDraft(field, value) {
  if (!tDraft) return;
  if (field === 'name' || field === 'desc') { tDraft[field] = value; return; }
  tDraft[field] = value;
  render();
}

function closeEditor() { S.tab = 'tests'; tDraft = null; render(); }

async function duplicateTest(id) {
  try {
    await API.post('/api/admin/tests/' + id + '/duplicate');
    await loadAdminData();
    toast('Test duplicated');
  } catch (e) { toast(e.message, 'error'); }
}

async function togglePublish(id) {
  const t = S.tests.find(x => x.id === id);
  if (!t) return;
  try {
    const r = await API.patch('/api/admin/tests/' + id + '/publish', { published: !t.published });
    await loadAdminData();
    toast(r.published ? '\u201C' + r.name + '\u201D published' : '\u201C' + r.name + '\u201D moved to drafts');
  } catch (e) { toast(e.message, 'error'); }
}

function confirmDeleteTest(id) {
  const t = S.tests.find(x => x.id === id);
  if (!t) return;
  confirmModal({
    title: 'Delete test?',
    body: '\u201C' + esc(t.name) + '\u201D will be permanently removed. Attempts already submitted are kept.',
    confirmLabel: 'Delete',
    danger: true,
    onConfirm: async () => {
      closeModal();
      try {
        await API.del('/api/admin/tests/' + id);
        await loadAdminData();
        toast('Test deleted');
      } catch (e) { toast(e.message, 'error'); }
    }
  });
}

function confirmDeleteQuestion(id) {
  const q = qOf(id);
  if (!q) return;
  confirmModal({
    title: 'Delete question?',
    body: 'This question will be removed from the bank and excluded from future tests.',
    confirmLabel: 'Delete',
    danger: true,
    onConfirm: async () => {
      closeModal();
      try {
        await API.del('/api/admin/questions/' + id);
        await loadAdminData();
        toast('Question deleted');
      } catch (e) { toast(e.message, 'error'); }
    }
  });
}

function setQFilter(field, value) { S.qFilters[field] = value; render(); }

function setQDraft(field, value) {
  if (!qDraft) return;
  qDraft[field] = value;
  if (field === 'type' && value === 'fill' && !qDraft.fillans) qDraft.fillans = '';
  if (field === 'type' && value === 'multi' && !qDraft.multiSel) qDraft.multiSel = new Set();
  if (field === 'type' && value === 'multi' && qDraft.multiSel.size === 0) qDraft.multiSel = new Set([0]);
  if (field === 'type' && value === 'matching' && (!qDraft.pairs || !qDraft.pairs.length)) qDraft.pairs = [{ l: '', r: '' }, { l: '', r: '' }];
  if (field === 'type' && value === 'ordering' && (!qDraft.ordered || !qDraft.ordered.length)) qDraft.ordered = ['', '', ''];
  if (field === 'type' && value === 'code' && (!qDraft.testCases || !qDraft.testCases.length)) qDraft.testCases = [{ args: '', expected: '', hidden: false }];
  if (field === 'type' && value === 'code' && !qDraft.codeStub) qDraft.codeStub = 'function solution(args) {\n  // write your code here\n  return null;\n}';
  openModal({
    title: qDraft.id ? 'Edit question' : 'Add question',
    body: questionModalBody(qDraft),
    foot: '<button class="btn btn-secondary" data-action="close-modal">Cancel</button>' +
          '<button class="btn btn-primary" data-action="save-question">' + ic('check', 14) + ' Save question</button>',
    wide: true
  });
}

function rerenderQuestionModal() {
  openModal({
    title: qDraft.id ? 'Edit question' : 'Add question',
    body: questionModalBody(qDraft),
    foot: '<button class="btn btn-secondary" data-action="close-modal">Cancel</button>' +
          '<button class="btn btn-primary" data-action="save-question">' + ic('check', 14) + ' Save question</button>',
    wide: true
  });
}

function setQDraftField(el) {
  if (!qDraft) return;
  const f = el.dataset.qdraft;
  if (f === 'opt') { qDraft.options[+el.dataset.i] = el.value; return; }
  if (f === 'fillans') { qDraft.fillans = el.value; return; }
  qDraft[f] = el.value;
}

/* ── Review toggle ─────────────────────────────────────────── */

function toggleReview(i) {
  const item = $$('.review-item')[i];
  if (item) item.classList.toggle('open');
}

/* ── Event delegation ──────────────────────────────────────── */

function onClick(e) {
  if (e.target.closest('[data-action="overlay-close"]') && e.target === e.target.closest('.modal-overlay')) {
    closeModal();
    return;
  }
  const el = e.target.closest('[data-action]');
  if (!el) {
    const menu = $('.user-menu.open');
    if (menu) { menu.classList.remove('open'); const chip = $('.user-chip'); if (chip) chip.setAttribute('aria-expanded', 'false'); }
    return;
  }
  const act = el.dataset.action;
  const val = el.dataset.value;
  const id = el.dataset.id;

  switch (act) {
    /* shell / navigation */
    case 'brand': S.mode = 'console'; S.tab = 'dashboard'; S.candView = 'home'; if (!S.auth) S.view = 'login'; render(); break;
    case 'mode': setMode(val); break;
    case 'tab': setTab(val); break;
    case 'cand-nav': S.candView = val; render(); break;
    case 'logout': logout(); break;
    case 'change-password': openPasswordModal(); break;
    case 'save-password': savePassword(); break;
    case 'sidebar-open':
      $('#sidebar').classList.add('open');
      $('#sidebarOverlay').classList.add('show');
      break;
    case 'sidebar-close':
      $('#sidebar').classList.remove('open');
      $('#sidebarOverlay').classList.remove('show');
      break;
    case 'user-menu':
    case 'cand-user-menu':
      const menu = el.nextElementSibling;
      const open = menu.classList.toggle('open');
      el.setAttribute('aria-expanded', open);
      break;

    /* auth */
    case 'show-register': S.view = 'register'; render(); break;
    case 'back-to-login': S.view = 'login'; render(); break;
    case 'go-candidate': setMode('candidate'); break;
    case 'go-console': S.mode = 'console'; S.view = S.auth ? 'app' : 'login'; render(); break;
    case 'cand-logout': candLogout(); break;
    case 'theme-toggle': toggleTheme(); break;

    /* console: tests */
    case 'new-test': startTestEditor(); break;
    case 'edit-test': startTestEditor(id); break;
    case 'duplicate-test': duplicateTest(id); break;
    case 'delete-test': confirmDeleteTest(id); break;
    case 'preview-test': openPreview(id); break;
    case 'editor-cancel': closeEditor(); break;
    case 'step': stepField(el.dataset.field, +el.dataset.dir); break;
    case 'toggle-cat': toggleCat(val); break;
    case 'set-diff': setDiffFocus(val); break;
    case 'save-test': saveTest(el.dataset.mode); break;

    /* console: questions */
    case 'add-question': openQuestionModal(); break;
    case 'edit-question': openQuestionModal(id); break;
    case 'delete-question': confirmDeleteQuestion(id); break;
    case 'reseed': reseedBank(); break;
    case 'qfilter': _pg.questions = 0; setQFilter(el.dataset.field, val); break;
    case 'qdiff': setQDraft('diff', val); break;
    case 'qtype': setQDraft('type', val); break;
    case 'qcorrect': setQDraft('answer', +val); break;
    case 'qmulti':
      if (qDraft) {
        const i = +val;
        if (qDraft.multiSel.has(i)) qDraft.multiSel.delete(i); else qDraft.multiSel.add(i);
        render();
        positionSeg('#qDiffSeg', '#qDiffThumb', Math.max(0, ['beginner', 'intermediate', 'advanced'].indexOf(qDraft.diff)));
        positionSeg('#qTypeSeg', '#qTypeThumb', { fill: 5, multi: 1, matching: 2, ordering: 3, mcq: 0, code: 4 }[qDraft.type] || 0);
      }
      break;
    case 'pair-add':
      if (qDraft) { qDraft.pairs.push({ l: '', r: '' }); rerenderQuestionModal(); }
      break;
    case 'pair-remove':
      if (qDraft) { qDraft.pairs.splice(+el.dataset.i, 1); if (!qDraft.pairs.length) qDraft.pairs = [{ l: '', r: '' }, { l: '', r: '' }]; rerenderQuestionModal(); }
      break;
    case 'pair-l':
      if (qDraft) { qDraft.pairs[+el.dataset.i].l = el.value; }
      break;
    case 'pair-r':
      if (qDraft) { qDraft.pairs[+el.dataset.i].r = el.value; }
      break;
    case 'order-add':
      if (qDraft) { qDraft.ordered.push(''); rerenderQuestionModal(); }
      break;
    case 'order-remove':
      if (qDraft) { qDraft.ordered.splice(+el.dataset.i, 1); if (!qDraft.ordered.length) qDraft.ordered = ['', '']; rerenderQuestionModal(); }
      break;
    case 'order-up':
      if (qDraft && +el.dataset.i > 0) { const i = +el.dataset.i; const a = qDraft.ordered; [a[i - 1], a[i]] = [a[i], a[i - 1]]; rerenderQuestionModal(); }
      break;
    case 'order-down':
      if (qDraft && +el.dataset.i < qDraft.ordered.length - 1) { const i = +el.dataset.i; const a = qDraft.ordered; [a[i + 1], a[i]] = [a[i], a[i + 1]]; rerenderQuestionModal(); }
      break;
    case 'order-item':
      if (qDraft) { qDraft.ordered[+el.dataset.i] = el.value; }
      break;
    case 'code-lang':
      if (qDraft) { qDraft.codeLang = val; rerenderQuestionModal(); }
      break;
    case 'code-stub':
      if (qDraft) { qDraft.codeStub = el.value; }
      break;
    case 'tc-args':
      if (qDraft) { qDraft.testCases[+el.dataset.i].args = el.value; }
      break;
    case 'tc-expected':
      if (qDraft) { qDraft.testCases[+el.dataset.i].expected = el.value; }
      break;
    case 'tc-hidden':
      if (qDraft) { qDraft.testCases[+el.dataset.i].hidden = el.checked; }
      break;
    case 'tc-add':
      if (qDraft) { qDraft.testCases.push({ args: '', expected: '', hidden: false }); rerenderQuestionModal(); }
      break;
    case 'tc-remove':
      if (qDraft) { qDraft.testCases.splice(+el.dataset.i, 1); if (!qDraft.testCases.length) qDraft.testCases = [{ args: '', expected: '', hidden: false }]; rerenderQuestionModal(); }
      break;
    case 'save-question': saveQuestion(); break;

    /* console: results */
    case 'view-attempt': openAttempt(id); break;
    case 'force-submit': forceSubmit(id); break;

    /* console: admins */
    case 'add-admin': openAddAdminModal(); break;
    case 'new-admin-role':
      _newAdminRole = val;
      $$('#newRoleSeg .seg-item').forEach(b => b.classList.toggle('active', b.dataset.value === val));
      positionSeg('#newRoleSeg', '#newRoleThumb', val === 'superadmin' ? 1 : 0);
      break;
    case 'save-admin': saveNewAdmin(); break;
    case 'delete-admin': confirmDeleteAdmin(id); break;

    /* console: candidates */
    case 'add-candidate': openAddCandidateModal(); break;
    case 'edit-candidate': openEditCandidateModal(id); break;
    case 'save-candidate': saveCandidate(); break;
    case 'delete-candidate': confirmDeleteCandidate(id); break;
    case 'pg': _pg[el.dataset.key] = +el.dataset.pg; render(); break;

    /* modals */
    case 'close-modal': closeModal(); break;
    case 'modal-confirm': if (modalConfirmCb) modalConfirmCb(); break;

    /* candidate: home */
    case 'start-test': openStartModal(id); break;
    case 'begin-attempt': beginAttemptFromModal(); break;
    case 'resume-attempt': resumeAttempt(); break;
    case 'discard-attempt': discardAttempt(); break;
    case 'back-home': backToHome(); break;

    /* candidate: runner */
    case 'opt': selectOpt(+el.dataset.opt); break;
    case 'match': handleMatchSelect(+el.dataset.i, el.value); break;
    case 'order-move': moveOrderItem(+el.dataset.pos, +el.dataset.dir); break;
    case 'run-code': runCode(); break;
    case 'flag': toggleFlag(); break;
    case 'prev-q': navQ(-1); break;
    case 'next-q': navQ(1); break;
    case 'jump': jumpTo(+el.dataset.idx); break;
    case 'ask-submit': askSubmit(); break;
    case 'confirm-submit': closeModal(); submitAttempt(false); break;
    case 'leave-test': leaveTest(); break;

    /* candidate: results */
    case 'toggle-review': toggleReview(+el.dataset.idx); break;
    case 'share-results': shareResults(); break;
    case 'share-result': shareResult(); break;
  }
}

function onInput(e) {
  const el = e.target;
  if (el.id === 'globalSearch') {
    S.qFilters.search = el.value.toLowerCase();
    S._focusSearch = 'global';
    if (S.mode === 'console') {
      if (S.tab === 'editor') return;
      if (S.tab === 'questions') _pg.questions = 0;
      else if (S.tab === 'tests') _pg.tests = 0;
      else if (S.tab === 'results') _pg.results = 0;
      else if (S.tab === 'activity') _pg.activity = 0;
      else if (S.tab === 'candidates') _pg.candidates = 0;
      else if (S.tab === 'admins') _pg.admins = 0;
      render();
    } else if (S.mode === 'candidate') {
      if (S.candView === 'runner') return;
      _pg.candTests = 0; _pg.candPassed = 0; _pg.candFailed = 0;
      render();
    }
    return;
  }
  if (el.id === 'qSearch') {
    S.qFilters.search = el.value.toLowerCase();
    S._focusSearch = 'local';
    _pg.questions = 0;
    render();
    return;
  }
  if (el.dataset && (el.dataset.action === 'pair-l' || el.dataset.action === 'pair-r' || el.dataset.action === 'order-item' || el.dataset.action === 'code-stub' || el.dataset.action === 'tc-args' || el.dataset.action === 'tc-expected')) {
    if (!qDraft) return;
    if (el.dataset.action === 'pair-l') qDraft.pairs[+el.dataset.i].l = el.value;
    else if (el.dataset.action === 'pair-r') qDraft.pairs[+el.dataset.i].r = el.value;
    else if (el.dataset.action === 'order-item') qDraft.ordered[+el.dataset.i] = el.value;
    else if (el.dataset.action === 'code-stub') qDraft.codeStub = el.value;
    else if (el.dataset.action === 'tc-args') qDraft.testCases[+el.dataset.i].args = el.value;
    else qDraft.testCases[+el.dataset.i].expected = el.value;
    return;
  }
  if (el.dataset && el.dataset.qdraft) { setQDraftField(el); return; }
  if (el.dataset && el.dataset.draft) { setDraft(el.dataset.draft, el.type === 'checkbox' ? el.checked : el.value); return; }
  if (el.dataset && el.dataset.action === 'fill') { handleFillInput(el); return; }
  if (el.dataset && el.dataset.action === 'code') { handleCodeInput(el); return; }
}

function onChange(e) {
  const el = e.target;
  if (el.dataset && el.dataset.action === 'toggle-publish') { togglePublish(el.dataset.id); return; }
  if (el.dataset && el.dataset.action === 'cand-test-toggle') { toggleCandidateTest(el.dataset.value); return; }
  if (el.dataset && el.dataset.qdraft) { setQDraftField(el); return; }
  if (el.dataset && el.dataset.draft) { setDraft(el.dataset.draft, el.type === 'checkbox' ? el.checked : el.value); return; }
}

function onSubmit(e) {
  const form = e.target;
  if (form.dataset.form === 'login') { e.preventDefault(); doLogin(e); }
  else if (form.dataset.form === 'register') { e.preventDefault(); doRegister(e); }
  else if (form.dataset.form === 'candidate-login') { e.preventDefault(); candLogin(); }
}

function onKey(e) {
  if (S.mode !== 'candidate' || S.candView !== 'runner' || !S.live) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  const q = qOf(S.live.order[S.qIdx]);
  if (!q) return;
  if ((q.type === 'mcq' || q.type === 'multi') && ['1', '2', '3', '4'].includes(e.key)) { e.preventDefault(); selectOpt(+e.key - 1); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFlag(); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); navQ(1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); navQ(-1); }
}

/* ── Proctoring: count tab / window switches during a live test ── */

function onVisibility() {
  if (document.hidden && S.mode === 'candidate' && S.candView === 'runner' && S.live) {
    S.live.leaves = (S.live.leaves || 0) + 1;
  }
}

function onWindowBlur() {
  if (S.mode === 'candidate' && S.candView === 'runner' && S.live && !document.hidden) {
    S.live.leaves = (S.live.leaves || 0) + 1;
  }
}

/* ── Boot ──────────────────────────────────────────────────── */

async function boot() {
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('submit', onSubmit);
  document.addEventListener('keydown', onKey);
  document.addEventListener('visibilitychange', onVisibility);
  window.addEventListener('blur', onWindowBlur);

  if (API.candToken) {
    S.mode = 'candidate';
    S.view = 'app';
    S.candView = 'home';
    await refreshCandidate();
  } else {
    const authed = await refreshAuth();
    if (authed) {
      S.view = 'app';
      await loadAdminData();
    } else {
      S.view = 'login';
    }
  }
  render();
}

boot();

</script>
